# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-iq-v2
services:
    kb-agent:
        project: agents/kb-agent
        host: azure.ai.agent
        language: docker
        uses:
            - iqv2project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1
            AZURE_SEARCH_ENDPOINT: https://foundryiqv2pau4search.search.windows.net
            AZURE_SEARCH_KNOWLEDGE_BASE_NAME: aw-knowledge-base
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Adventure Works retail customer-support agent, grounded in a Foundry IQ Knowledge Base.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - RAG
                - Azure AI Search
                - Foundry IQ
        name: kb-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python main.py
    courier-agent:
        project: agents/courier-agent
        host: azure.ai.agent
        language: docker
        uses:
            - iqv2project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Courier and parcel-delivery assistant, grounded in live web search.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Web Search
        name: courier-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python main.py
    orchestrator-agent:
        project: agents/orchestrator-agent
        host: azure.ai.agent
        language: docker
        uses:
            - iqv2project
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1
            AZURE_SEARCH_ENDPOINT: https://foundryiqv2pau4search.search.windows.net
            AZURE_SEARCH_KNOWLEDGE_BASE_NAME: aw-knowledge-base
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            Top-level Adventure Works orchestrator: kb/courier in-process (no A2A), Fabric via an OBO-enabled toolbox.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - Multi-Agent Orchestration
                - Toolbox
        name: orchestrator-agent
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python main.py
    iqv2project:
        host: azure.ai.project
        endpoint: https://foundryiqv2pau4.services.ai.azure.com/api/projects/iqv2project
infra:
    provider: microsoft.foundry
