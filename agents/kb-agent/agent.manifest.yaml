name: kb-agent
description: >
  Adventure Works retail customer-support agent, grounded in a Foundry IQ
  Knowledge Base over payment/purchase/shipping/refund, terms & conditions,
  and support representative guide documents.
metadata:
  tags:
    - Agent Framework
    - AI Agent Hosting
    - Azure AI AgentServer
    - Responses Protocol
    - RAG
    - Azure AI Search
    - Foundry IQ
template:
  name: kb-agent
  kind: hosted
  protocols:
    - protocol: responses
      version: 2.0.0
  environment_variables:
    - name: AZURE_AI_MODEL_DEPLOYMENT_NAME
      value: "{{AZURE_AI_MODEL_DEPLOYMENT_NAME}}"
    - name: AZURE_SEARCH_ENDPOINT
      value: "{{AZURE_SEARCH_ENDPOINT}}"
    - name: AZURE_SEARCH_KNOWLEDGE_BASE_NAME
      value: "aw-knowledge-base"
resources:
  - kind: model
    id: gpt-4.1
    name: AZURE_AI_MODEL_DEPLOYMENT_NAME
